<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AULUNE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #F7F3F8;
            color: #493B4F;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #77549B;
        }

        nav a {
            text-decoration: none;
            color: #493B4F;
            margin-left: 25px;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .hero h1 {
            font-size: 60px;
            margin-bottom: 20px;
            color: #77549B;
        }

        .hero p {
            font-size: 18px;
            max-width: 550px;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .hero button {
            background-color: #77549B;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
        }

        .hero button:hover {
            background-color: #493B4F;
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">☾ AULUNE</div>

        <div>
            <a href="#">Explore</a>
            <a href="#">Stories</a>
            <a href="#">Login</a>
        </div>
    </nav>

    <section class="hero">
        <h1>Your AU, Your Own Universe.</h1>

        <p>
            Discover stories beyond reality.
            Read, create, and bring your own universe to life with AULUNE.
        </p>

        <button>Explore Your Universe ✦</button>
    </section>

</body>
</html>
